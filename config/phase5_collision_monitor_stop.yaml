collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_pre_collision
    cmd_vel_out_topic: /cmd_vel
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 1.5
    polygons: ["StopFront"]
    StopFront:
      type: polygon
      points: [0.10, 0.28, 0.50, 0.28, 0.50, -0.28, 0.10, -0.28]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: /task2/stop_polygon
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /scan
      enabled: true
